services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trashmail_backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-trashmail123}
      - OLLAMA_URL=http://host.docker.internal:11434
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app/geo/data:/app/app/geo/data
      - ./backend/app/db:/app/app/db
    depends_on:
      - neo4j
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: trashmail_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-trashmail123}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trashmail_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
